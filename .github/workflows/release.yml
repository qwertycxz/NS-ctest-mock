# yaml-language-server: $schema=https://schemastore.org/github-workflow
jobs:
  release:
    container:
      image: devkitpro/devkita64:latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: make
      - run: tar -cf NS-ctest-mock.tar atmosphere
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          append_body: true
          discussion_category_name: Announcements
          files: NS-ctest-mock.tar
          generate_release_notes: true
          make_latest: true
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  discussions: write
